<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamRip Core · Video & Captions</title>
  <link rel="icon" href="Logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter font fallback for Cal Sans UI and Matter specifications -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="app-card">
    <header class="window-header">
      <div class="brand-meta">
        <img src="Logo.svg" alt="StreamRip logo" class="brand-mark" width="28" height="28" />
        <h1 class="app-title">StreamRip Core</h1>
      </div>
      <div class="header-actions">
        <div class="mode-toggle" role="tablist" aria-label="Source mode">
          <button type="button" id="mode-youtube" class="active" role="tab" aria-selected="true">YouTube</button>
          <button type="button" id="mode-spotify" role="tab" aria-selected="false">Spotify</button>
        </div>
        <button type="button" class="btn-update" id="btn-update">Check Updates</button>
        <div class="system-status">
          <span class="status-pip" id="status-pip"></span>
          <span id="status-label">Standby</span>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <!-- Left Config Section -->
      <section class="workspace-pane">
        <div class="field-group">
          <div class="field-header">
            <label class="field-label" for="target-url">Source URL</label>
            <span class="field-hint">youtube / playlists</span>
          </div>
          <input 
            id="target-url" 
            class="input-pill-text" 
            type="url" 
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="field-group">
          <div class="field-header">
            <label class="field-label" for="dest-path">Export Destination</label>
          </div>
          <div class="dest-row">
            <input 
              id="dest-path" 
              class="input-pill-text" 
              type="text" 
              placeholder="Default downloads folder..."
              spellcheck="false"
            />
            <button type="button" class="btn-secondary" id="btn-browse">Browse</button>
          </div>
        </div>

        <div class="selector-grid" id="youtube-selectors">
          <div class="field-group">
            <label class="field-label" for="select-quality" id="label-quality">Media Stream</label>
            <div class="select-wrap">
              <select id="select-quality" class="native-select">
                <option>Best Available (Source)</option>
                <option>1080p (FHD)</option>
                <option>720p (HD)</option>
                <option>480p (SD)</option>
              </select>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6">
                <path d="M1 1L5 5L9 1"/>
              </svg>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="select-caption">Caption Envelope</label>
            <div class="select-wrap">
              <select id="select-caption" class="native-select">
                <option>SubRip Subtitle (.srt)</option>
                <option>WebVTT (.vtt)</option>
                <option>Advanced SubStation (.ass)</option>
                <option>Timed Lyrics (.lrc)</option>
              </select>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6">
                <path d="M1 1L5 5L9 1"/>
              </svg>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="select-transcript-lang">Transcript Language</label>
            <div class="select-wrap">
              <select id="select-transcript-lang" class="native-select">
                <option>English</option>
                <option>Spanish</option>
                <option>Hindi</option>
                <option>Arabic</option>
                <option>French</option>
                <option>German</option>
                <option>Portuguese</option>
                <option>Russian</option>
                <option>Japanese</option>
                <option>Korean</option>
                <option>Italian</option>
                <option>Dutch</option>
                <option>Turkish</option>
                <option>Indonesian</option>
                <option>Bengali</option>
                <option>Urdu</option>
                <option>Vietnamese</option>
                <option>Chinese</option>
                <option>All languages</option>
              </select>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6">
                <path d="M1 1L5 5L9 1"/>
              </svg>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="select-file-format">File Format</label>
            <div class="select-wrap">
              <select id="select-file-format" class="native-select">
                <option>Match Source (no conversion)</option>
                <option>MP4 Video (.mp4)</option>
                <option>MKV Video (.mkv)</option>
                <option>MP3 Audio (.mp3)</option>
                <option>M4A Audio (.m4a)</option>
                <option>OPUS Audio (.opus)</option>
                <option>FLAC Audio (.flac)</option>
                <option>WAV Audio (.wav)</option>
              </select>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6">
                <path d="M1 1L5 5L9 1"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="selector-grid" id="spotify-selectors" hidden style="display: none;">
          <div class="field-group">
            <label class="field-label" for="select-format">Audio Format</label>
            <div class="select-wrap">
              <select id="select-format" class="native-select">
                <option>MP3 Audio (.mp3)</option>
                <option>FLAC Lossless (.flac)</option>
                <option>OGG Vorbis (.ogg)</option>
                <option>Opus (.opus)</option>
                <option>M4A (.m4a)</option>
                <option>WAV (.wav)</option>
              </select>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6">
                <path d="M1 1L5 5L9 1"/>
              </svg>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="select-bitrate">Bitrate</label>
            <div class="select-wrap">
              <select id="select-bitrate" class="native-select">
                <option>Auto (Best Match)</option>
                <option>320 kbps (High)</option>
                <option>256 kbps</option>
                <option>192 kbps</option>
                <option>128 kbps</option>
              </select>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6">
                <path d="M1 1L5 5L9 1"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="config-card" id="spotify-options-card" hidden style="display: none;">
          <label class="checkbox-item" for="chk-lyrics">
            <input type="checkbox" id="chk-lyrics" />
            <span class="checkbox-target">
              <svg viewBox="0 0 12 12"><path d="M2 6L5 9L10 3"/></svg>
            </span>
            <span class="checkbox-meta">
              <span class="checkbox-title">Synced Lyrics (.lrc)</span>
              <span class="checkbox-caption">Saves timestamped lyrics next to each track where available.</span>
            </span>
          </label>
        </div>

        <div class="config-card" id="youtube-options-card">
          <label class="checkbox-item" for="chk-transcript">
            <input type="checkbox" id="chk-transcript" />
            <span class="checkbox-target">
              <svg viewBox="0 0 12 12"><path d="M2 6L5 9L10 3"/></svg>
            </span>
            <span class="checkbox-meta">
              <span class="checkbox-title">Capture Transcripts & Timestamps</span>
              <span class="checkbox-caption">Saves one transcript in your chosen language next to each video.</span>
            </span>
          </label>

        </div>

        <div class="action-bottom">
          <button type="button" class="btn-pill-primary" id="btn-download">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M7 1v8m0 0L4 6m3 3l3-3M2 11h10"/>
            </svg>
            Start Extraction
          </button>
          <div class="progress-track">
            <div class="progress-fill" id="progress-bar"></div>
          </div>
        </div>
      </section>

      <!-- Right Side Log Terminal -->
      <aside class="log-pane">
        <div class="log-header">
          <span class="log-heading">Pipeline Output</span>
          <button type="button" class="log-btn-link" id="btn-clear-feed">Clear</button>
        </div>
        <div class="log-body" id="console-feed">
          <div>Ready. System initialized.</div>
          <div class="entry-blue">Awaiting target input URL...</div>
        </div>
      </aside>
    </div>
  </main>

  <!-- In-Browser Folder Browser Modal -->
  <div class="folder-overlay" id="folder-overlay" role="dialog" aria-modal="true" aria-label="Choose folder">
    <div class="folder-dialog">
      <div class="folder-head">
        <div class="folder-title">Choose export folder</div>
        <div class="folder-path" id="folder-path">...</div>
        <div class="folder-nav">
          <button type="button" id="folder-up">Up</button>
          <button type="button" id="folder-home">Home</button>
          <button type="button" id="folder-drives">Drives</button>
        </div>
      </div>
      <div class="folder-list" id="folder-list"></div>
      <div class="folder-foot">
        <button type="button" class="btn-secondary" id="folder-cancel" style="padding:9px 16px">Cancel</button>
        <button type="button" class="btn-pill-primary" id="folder-select" style="width:auto;padding:0 20px;height:38px">Select this folder</button>
      </div>
    </div>
  </div>

  <!-- Modular Application Scripts -->
  <script src="js/state.js"></script>
  <script src="js/folderPicker.js"></script>
  <script src="js/dropdown.js"></script>
  <script src="js/downloader.js"></script>
  <script src="js/updater.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
